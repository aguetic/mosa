rc: .lefthook/env.sh

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc,astro,css}"
      run: mise x -- just check-staged {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: mise x -- just typecheck
    unit:
      run: mise x -- just test-unit
