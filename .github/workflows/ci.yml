name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(mise x -- pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise x -- just install

      - name: Format and lint
        run: mise x -- just check

      - name: Typecheck
        run: mise x -- just typecheck

      - name: Unit tests
        run: mise x -- just test-unit

      - name: Build
        run: mise x -- just build

  database:
    name: Database verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(mise x -- pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise x -- just install

      - name: Verify database
        run: mise x -- just test-db

      - name: Check generated database types
        run: mise x -- just db-types-check

  docker:
    name: Explorer image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Build production image
        run: mise x -- just explorer-image

  migrate:
    name: Apply production migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, database, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(mise x -- pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise x -- just install

      - name: Apply production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mise x -- just supabase link --project-ref "$SUPABASE_PROJECT_ID"
          mise x -- just supabase db push

  deploy-explorer:
    name: Deploy research explorer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: explorer-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Coolify deployment
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          curl --fail --show-error --silent --request GET \
            "$DEPLOY_WEBHOOK"

      - name: Smoke-test production URL
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "PRODUCTION_URL secret is required" >&2
            exit 1
          fi
          deadline=$((SECONDS + 180))
          until curl --fail --show-error --silent --max-time 10 "${PRODUCTION_URL}" >/dev/null; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Production URL did not become reachable within 180s: ${PRODUCTION_URL}" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Production smoke test passed for ${PRODUCTION_URL}"
          echo "requested_sha=${GITHUB_SHA}; confirm the deployed revision in Coolify" >> "${GITHUB_STEP_SUMMARY}"
