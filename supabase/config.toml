project_id = "mosa-db"

[api]
enabled = false

[db]
# Must match the PostgreSQL major version used by the hosted project.
major_version = 17
# Explorer and local scripts hard-code this default port.
port = 54322

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
